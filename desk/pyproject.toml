[project]
name = "trading-desk"
version = "0.1.0"
description = "Desk de trading multi-agents sur Hyperliquid — architecture a deux vitesses"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "websockets>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Rien de tout cela n'est requis pour la phase P0 : le desk tourne sur SQLite
# et n'a besoin ni de Postgres, ni de LLM, ni de moteur de backtest.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.2", "redis>=5"]
agents = ["langgraph>=0.2", "langchain-core>=0.3", "anthropic>=0.40"]
backtest = ["nautilus_trader>=1.200", "polars>=1.0", "numpy>=2.0"]

[project.scripts]
desk = "trading_desk.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # texte francais sans accents dans le code
