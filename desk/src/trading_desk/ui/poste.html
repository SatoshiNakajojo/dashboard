<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk — Poste de pilotage</title>
<link rel="stylesheet" href="/ui/poste/poste.css">
</head>

<!--
  Le poste de pilotage.

  Trois etats : l'accueil, la sequence d'embarquement, le poste. Le decor
  est l'IMAGE SUR LAQUELLE LA SEQUENCE SE TERMINE — pas une autre prise du
  meme cockpit. C'est ce qui rend le raccord invisible, et aucune image
  choisie separement ne le garantirait.

  Les panneaux du desk sont charges tels quels depuis `/panneaux`, dans une
  iframe posee sur la dalle. Ce n'est pas de la paresse : l'ancien poste
  recopiait tout le balisage de l'application dans sa propre page, et cette
  seconde copie devait etre tenue synchronisee a la main. Deux
  implementations du meme ecran finissent toujours par diverger, et c'est
  celle qu'on regarde le moins qui derive.
-->

<body>

<!-- 1. L'accueil -->
<!-- L'accueil montre LA PREMIERE IMAGE DE LA SEQUENCE : le poste vu en
     entier, la Terre par les hublots. Meme cadrage que la video, donc le
     clic ne provoque aucun saut — on part de l'image qu'on regardait.
     La sequence se termine, elle, sur le decor : les deux raccords sont
     ainsi exacts par construction, au debut comme a la fin. -->
<div id="embarquement" role="button" tabindex="0"
     aria-label="Embarquer — lance la séquence d'arrivée au poste">
  <div class="scene">
    <img class="decor" src="/ui/poste/assets/accueil.jpg" alt=""
         draggable="false">
  </div>
  <div class="voile"></div>
  <div class="accueil">
    <h1>Welcome on board Boss</h1>
    <div class="trait"></div>
    <p>Cliquez pour embarquer</p>
  </div>
</div>

<!-- 2. La sequence.
     Deux encodages : H.264 pour Safari et les navigateurs de bureau, VP9
     pour ceux qui sont construits sans codec proprietaire — dont le
     Chromium de test. Sans le second, la sequence ne pouvait meme pas etre
     verifiee ici, et un chemin qu'on ne peut pas eprouver est un chemin
     qu'on croit bon.

     Le codec est declare EN ENTIER, pas seulement le conteneur : un
     navigateur qui lit « video/mp4 » se croit capable et telecharge trois
     megaoctets avant de decouvrir qu'il n'a pas H.264. Avec le profil et le
     niveau, il saute le fichier sans rien demander. -->
<div id="sequence" hidden>
  <!-- Une seule balise video pour TOUTES les transitions : embarquement,
       retour a la vue d'ensemble, aller et retour vers l'ecran de gauche.
       Les sources sont posees par le script au moment de jouer. Quatre
       elements video distincts auraient voulu dire quatre etats a garder
       synchronises, et trois d'entre eux toujours en train de se taire. -->
  <video id="film" playsinline preload="auto"></video>
</div>
<button class="passer" id="passer" type="button" hidden>Passer</button>

<!-- 3. Le poste. Monte des le depart, SOUS les deux couches ci-dessus :
     on ne le revele pas a la fin, on retire ce qui le couvrait. Un decor
     deja peint ne peut pas manquer son entree — et les panneaux ont le
     temps de se charger pendant l'accueil. -->
<div id="poste">
  <div class="scene">
    <img class="decor" src="/ui/poste/assets/poste.jpg"
         alt="Poste de pilotage" draggable="false">
    <iframe class="verre" src="/panneaux?verre"
            title="Desk — état, mandat et invariants"></iframe>
    <div class="reflet"></div>
  </div>
</div>

<!-- 4. L'ecran de gauche : le collecteur de donnees du VPS.
     Monte comme le poste — toujours la, dessous — pour la meme raison :
     un decor deja peint ne peut pas manquer son entree. Il ne porte pas
     les memes panneaux mais LA MEME PAGE, en vue `flux`. -->
<div id="gauche" hidden>
  <div class="scene">
    <img class="decor" src="/ui/poste/assets/gauche.jpg"
         alt="Écran de gauche — collecteur de données" draggable="false">
    <iframe class="verre-gauche" src="/panneaux?verre&amp;vue=flux"
            title="Collecteur de données — flux"></iframe>
    <div class="reflet-gauche"></div>
  </div>
</div>

<button class="revoir" id="retourPfd" type="button" hidden>Return to PFD</button>

<!-- Le retour a la vue d'ensemble. Le poste est un gros plan : une fois
     dedans, on ne voyait plus le vaisseau. Ce bouton redonne la vue du
     debut sans recharger la page. -->
<button class="revoir" id="revoir" type="button"
        title="Revoir le poste en entier">Vue d'ensemble</button>

<div class="sortie">
  Desk · <a href="/panneaux">vue sans décor</a>
</div>

<script src="/ui/poste/poste.js"></script>
</body>
</html>
