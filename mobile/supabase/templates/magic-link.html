<table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0;padding:0">
  <tr>
    <td align="center" style="padding:28px 12px">

      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;border:1px solid #DCD4C6">
        <tr>
          <td style="padding:30px 28px">

            <p style="margin:0;font-family:Courier,monospace;font-size:12px;color:#7A5A1C;letter-spacing:2px">
              CRYPTOS CLUB
            </p>

            <p style="margin:14px 0 0;font-family:Georgia,serif;font-size:25px;color:#141210">
              Votre code d'entr&eacute;e
            </p>

            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0">
              <tr>
                <td align="center" style="border:2px solid #141210;padding:18px 8px">
                  <span style="font-family:Courier,monospace;font-size:34px;font-weight:bold;color:#141210;letter-spacing:8px">{{ .Token }}</span>
                </td>
              </tr>
            </table>

            <p style="margin:0;font-family:Arial,sans-serif;font-size:14px;line-height:22px;color:#3D3830">
              Saisissez-le dans l'app. Il expire dans une heure et ne sert qu'une fois.
            </p>

            <p style="margin:20px 0 0;font-family:Arial,sans-serif;font-size:12px;line-height:19px;color:#6B6355">
              Vous n'avez rien demand&eacute;&nbsp;? Ignorez ce message &mdash; sans ce code, personne n'entre.
            </p>

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
