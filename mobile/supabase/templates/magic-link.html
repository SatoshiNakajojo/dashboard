<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0A0806" style="background-color:#0A0806;margin:0;padding:0">
  <tr>
    <td align="center" style="padding:32px 12px">

      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px">
        <tr>
          <td bgcolor="#12100C" style="background-color:#12100C;border:1px solid #1E1811;padding:32px 28px">

            <p style="margin:0;font-family:Courier,monospace;font-size:12px;color:#8C7F68;letter-spacing:2px">
              CRYPTOS CLUB
            </p>

            <p style="margin:16px 0 0;font-family:Georgia,serif;font-size:26px;color:#F2EBDD">
              Votre code d'entrée
            </p>

            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:26px 0">
              <tr>
                <td align="center" bgcolor="#0D0B08" style="background-color:#0D0B08;padding:20px 8px">
                  <span style="font-family:Courier,monospace;font-size:34px;font-weight:bold;color:#F2EBDD;letter-spacing:8px">{{ .Token }}</span>
                </td>
              </tr>
            </table>

            <p style="margin:0;font-family:Arial,sans-serif;font-size:14px;line-height:22px;color:#9A8F7B">
              Saisissez-le dans l'app. Il expire dans une heure et ne sert qu'une fois.
            </p>

            <p style="margin:22px 0 0;font-family:Arial,sans-serif;font-size:12px;line-height:19px;color:#5C5446">
              Vous n'avez rien demandé&nbsp;? Ignorez ce message — sans ce code, personne n'entre.
            </p>

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
