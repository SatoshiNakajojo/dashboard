<!--
  Gabarit « Magic Link » — Supabase → Authentication → Emails.

  ⚠️ Le gabarit par défaut de Supabase contient `{{ .ConfirmationURL }}`, donc un
  LIEN. L'app attend un CODE à six chiffres : c'est `{{ .Token }}` qu'il faut.

  Pourquoi le code plutôt que le lien, pour une app installée sur l'écran
  d'accueil : sur iOS, un lien ouvre **Safari**, pas la PWA. La session
  atterrirait dans le stockage de Safari, que l'app installée ne voit pas — le
  membre se croirait connecté et retomberait sur l'écran d'entrée.

  Le code, lui, se tape dans l'app. Il marche aussi quand le courriel est ouvert
  sur un autre appareil que le téléphone.
-->
<div style="margin:0;padding:32px 16px;background:#0A0806;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <div style="max-width:420px;margin:0 auto;background:#12100C;border:1px solid #1E1811;border-radius:4px;padding:32px 28px">

    <div style="font:400 11px/1 'JetBrains Mono',ui-monospace,monospace;color:#8C7F68;letter-spacing:2.3px;text-transform:uppercase">
      Cryptos Club
    </div>

    <div style="font:400 26px/1.15 Georgia,'Times New Roman',serif;color:#F2EBDD;margin-top:14px">
      Votre code d’entrée
    </div>

    <div style="margin:28px 0;padding:18px 0;border-top:1px solid #1A1510;border-bottom:1px solid #1A1510;text-align:center">
      <div style="font:600 34px/1 ui-monospace,'SF Mono',Menlo,monospace;color:#F2EBDD;letter-spacing:10px">
        {{ .Token }}
      </div>
    </div>

    <div style="font:400 13px/1.7 -apple-system,sans-serif;color:#9A8F7B">
      Saisissez-le dans l’app. Il expire dans une heure et ne sert qu’une fois.
    </div>

    <div style="font:400 11px/1.6 -apple-system,sans-serif;color:#5C5446;margin-top:22px">
      Vous n’avez rien demandé ? Ignorez ce message — sans ce code, personne
      n’entre.
    </div>
  </div>
</div>
