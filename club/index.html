    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; background: #0A0806;
        transition: opacity .25s ease-out;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      /* Le sceau d'abord : 60 % de la largeur, 240 px au plus. L'image de
         512 px reste nette sur un écran Retina à cette taille. */
      #boot-logo { width: min(60vw, 240px); height: auto; aspect-ratio: 1; }
      #boot-chain { position: relative; }
      /* « width: max-content » et « flex: none » ensemble : sans eux, les
         blocs du calque doré se compriment dans la largeur animée au lieu
         d'être découpés par elle, et la chaîne se remplit de tranches au lieu
         de blocs. Le défaut ne se voit qu'une fois l'animation lancée.
         (Pas de guillemets obliques ici : on est dans un gabarit de chaîne.) */
      .boot-row { display: flex; align-items: center; width: max-content; }
      /* Le bloc. */
      .boot-b {
        flex: none; box-sizing: border-box;
        width: 16px; height: 16px; border-radius: 2px;
        border: 1px solid #3A2F1E;
        display: flex; flex-direction: column; justify-content: center; gap: 2px;
        padding: 0 3px;
      }
      /* Les deux lignes de données à l'intérieur. */
      .boot-b b { display: block; height: 1px; background: #3A2F1E; }
      .boot-b b:last-child { width: 60%; }
      /* Le maillon vers le bloc suivant. */
      u.boot-b {
        width: 8px; height: 2px; border: 0; border-radius: 1px;
        background: #3A2F1E; padding: 0;
      }
      .boot-b.on { border-color: #E8903D; background: #E8903D; }
      .boot-b.on b { background: #0A0806; }
      u.boot-b.on { background: #E8903D; }
      /* Le remplissage est un calque découpé qui s'élargit par paliers. */
      #boot-fill {
        position: absolute; inset: 0; overflow: hidden; width: 0;
        animation: boot-mine 1650ms steps(1, end) infinite;
      }
      @keyframes boot-mine {
        0.00% { width: 0px; }
        9.09% { width: 16px; }
        18.18% { width: 40px; }
        27.27% { width: 64px; }
        36.36% { width: 88px; }
        45.45% { width: 112px; }
        54.55% { width: 136px; }
        63.64% { width: 160px; }
        72.73% { width: 184px; }
        100% { width: 184px; }
      }
      #boot-label {
        margin: 0; color: #6D6455;
        /* La police système : Inter n'est pas encore chargée à ce stade, et ses
           capitales espacées ressemblent à celles d'Inter. */
        font: 500 9px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 2.2px;
      }
      @media (prefers-reduced-motion: reduce) {
        /* Sans mouvement, la chaîne reste pleine : elle dit encore « ça
           travaille » sans imposer une animation à qui n'en veut pas. */
        #boot-fill { animation: none; width: 184px; }
      }
    </style>
